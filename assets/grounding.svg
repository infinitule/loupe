<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" width="1040" height="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="1040" height="340" rx="16" fill="#0B0F14"/><text x="44" y="44" font-size="17" fill="#E6EDF3" text-anchor="start" font-weight="600">Why grounding is the whole game</text><text x="44" y="66" font-size="12.5" fill="#8B949E" text-anchor="start" font-weight="400">Same model, same defect, same schema — only the amount of context differs.</text><text x="44" y="110" font-size="13.5" fill="#E6EDF3" text-anchor="start" font-weight="600">whole file — 35 lines</text><text x="746" y="132" font-size="14" fill="#FF7B72" text-anchor="start" font-weight="700">no answer</text><rect x="44" y="120" width="680" height="34" rx="9" fill="#FF7B72" opacity="0.16"/><rect x="44" y="120" width="680" height="34" rx="9" fill="none" stroke="#FF7B72" stroke-width="1.25"/><text x="58" y="142" font-size="11.5" fill="#8B949E" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">193s · 3,434 tokens generated</text><text x="44" y="188" font-size="13.5" fill="#E6EDF3" text-anchor="start" font-weight="600">RPR span — 10 lines</text><text x="746" y="210" font-size="14" fill="#3FB950" text-anchor="start" font-weight="700">correct fix</text><rect x="44" y="198" width="109" height="34" rx="9" fill="#3FB950" opacity="0.2"/><rect x="44" y="198" width="109" height="34" rx="9" fill="none" stroke="#3FB950" stroke-width="1.25"/><text x="167.22279792746116" y="220" font-size="11.5" fill="#8B949E" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">31s · 644 tokens</text><line x1="44" y1="260" x2="724" y2="260" stroke="#1E2A38"/><text x="44" y="288" font-size="12.5" fill="#8B949E" text-anchor="start" font-weight="400">Given everything, the model runs away into an empty reasoning trace and never calls the tool.</text><text x="44" y="308" font-size="12.5" fill="#E6EDF3" text-anchor="start" font-weight="400">Given only what matters, it answers.</text></svg>