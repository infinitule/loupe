<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="1200" height="440" rx="16" fill="#0B0F14"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="2.8" orient="auto"><path d="M0,0 L0,5.6 L7,2.8 z" fill="#6E7A87"/></marker><marker id="am" markerWidth="8" markerHeight="8" refX="7" refY="2.8" orient="auto"><path d="M0,0 L0,5.6 L7,2.8 z" fill="#D29922"/></marker></defs><text x="44" y="44" font-size="17" fill="#E6EDF3" text-anchor="start" font-weight="600">The loop</text><text x="44" y="66" font-size="12.5" fill="#8B949E" text-anchor="start" font-weight="400">RPR decides what the model sees and which questions it may answer. The model only ever fills in blanks.</text><rect x="44" y="96" width="158" height="86" rx="12" fill="#111820" stroke="#1E2A38" stroke-width="1.25"/><text x="123.0" y="123" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Input</text><text x="123.0" y="144" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">clipboard, file,</text><text x="123.0" y="160" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">selection</text><rect x="234" y="96" width="158" height="86" rx="12" fill="#111820" stroke="#58A6FF" stroke-width="1.25"/><text x="313.0" y="123" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">RPR</text><text x="313.0" y="144" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">filter bank →</text><text x="313.0" y="160" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">which period broke</text><line x1="206" y1="139.0" x2="228" y2="139.0" stroke="#6E7A87" stroke-width="1.5" marker-end="url(#ar)"/><rect x="424" y="96" width="158" height="86" rx="12" fill="#111820" stroke="#BC8CFF" stroke-width="1.25"/><text x="503.0" y="123" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Schema</text><text x="503.0" y="144" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">ops for that</text><text x="503.0" y="160" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">scale only</text><line x1="396" y1="139.0" x2="418" y2="139.0" stroke="#6E7A87" stroke-width="1.5" marker-end="url(#ar)"/><rect x="614" y="96" width="158" height="86" rx="12" fill="#111820" stroke="#1E2A38" stroke-width="1.25"/><text x="693.0" y="123" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">qwen 0.8B</text><text x="693.0" y="144" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">fills parameters</text><text x="693.0" y="160" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">never writes prose</text><line x1="586" y1="139.0" x2="608" y2="139.0" stroke="#6E7A87" stroke-width="1.5" marker-end="url(#ar)"/><rect x="804" y="96" width="158" height="86" rx="12" fill="#111820" stroke="#3FB950" stroke-width="1.25"/><text x="883.0" y="123" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Verify</text><text x="883.0" y="144" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">span in range?</text><text x="883.0" y="160" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">code whole?</text><line x1="776" y1="139.0" x2="798" y2="139.0" stroke="#6E7A87" stroke-width="1.5" marker-end="url(#ar)"/><rect x="994" y="96" width="158" height="86" rx="12" fill="#111820" stroke="#1E2A38" stroke-width="1.25"/><text x="1073.0" y="123" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Compose</text><text x="1073.0" y="144" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">deterministic</text><text x="1073.0" y="160" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">→ the answer</text><line x1="966" y1="139.0" x2="988" y2="139.0" stroke="#6E7A87" stroke-width="1.5" marker-end="url(#ar)"/><rect x="408" y="212" width="190" height="26" rx="7" fill="#0F1620" stroke="#58A6FF" stroke-width="1.1" opacity="0.95"/><text x="420" y="229" font-size="11.5" fill="#58A6FF" text-anchor="start" font-weight="600">line</text><text x="590" y="229" font-size="11" fill="#6E7A87" text-anchor="end" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">q 1·2</text><rect x="408" y="246" width="190" height="26" rx="7" fill="#0F1620" stroke="#BC8CFF" stroke-width="1.1" opacity="0.95"/><text x="420" y="263" font-size="11.5" fill="#BC8CFF" text-anchor="start" font-weight="600">block</text><text x="590" y="263" font-size="11" fill="#6E7A87" text-anchor="end" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">q 3·4·6</text><rect x="408" y="280" width="190" height="26" rx="7" fill="#0F1620" stroke="#FF7B72" stroke-width="1.1" opacity="0.95"/><text x="420" y="297" font-size="11.5" fill="#FF7B72" text-anchor="start" font-weight="600">section</text><text x="590" y="297" font-size="11" fill="#6E7A87" text-anchor="end" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">q 8·12·24</text><line x1="503" y1="182" x2="503" y2="206" stroke="#1E2A38" stroke-width="1"/><text x="503" y="330" font-size="11" fill="#6E7A87" text-anchor="middle" font-weight="400">the disrupted period selects the schema</text><path d="M883.0,182 C883.0,246 693.0,246 693.0,188" fill="none" stroke="#D29922" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#am)"/><text x="788.0" y="262" font-size="11" fill="#D29922" text-anchor="middle" font-weight="400">Refine — one retry, complaint named</text><rect x="44" y="352" width="1112" height="60" rx="12" fill="#111820" stroke="#1E2A38"/><text x="64" y="376" font-size="12.5" fill="#E6EDF3" text-anchor="start" font-weight="600">Ground — only the localised span is sent to the model.</text><text x="64" y="396" font-size="12" fill="#8B949E" text-anchor="start" font-weight="400">Whole 35-line file → 3,434 tokens, 193s, no tool call.    Same defect in a 10-line window → 644 tokens, 31s, correct.</text></svg>